<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Taverne McCain</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
body{font-family:'Inter',sans-serif;background:#0f172a}
.card{background:white;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.3);transition:all 0.3s}
</style>
</head>
<body>
<div id="app"></div>
<script>
var SUPABASE_URL='https://laigpbuffioclbujqpdn.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhaWdwYnVmZmlvY2xidWpxcGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzNDA0NjYsImV4cCI6MjA3OTkxNjQ2Nn0.j3elynhftD_GobG3YW3Pc2qMSULmqAOjAlS4nfmkn04';
var ADMIN_PASSWORD='5121';

var state={authenticated:false,loading:true,orders:[],scratches:[],tickets:{},taverneStatus:'open'};

async function supabaseQuery(endpoint,method,data){
  try{
    var options={
      method:method,
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      }
    };
    if(data)options.body=JSON.stringify(data);
    var response=await fetch(SUPABASE_URL+'/rest/v1/'+endpoint,options);
    if(response.ok){
      var result=await response.json();
      return result;
    }
    console.error('Erreur Supabase:',response.status);
    return null;
  }catch(e){
    console.error('Erreur Supabase:',e);
    return null;
  }
}

async function loadTickets(){
  var GITHUB_TICKETS_URL='https://raw.githubusercontent.com/TheAmazingArtixx/Taverne-McCain---LS/refs/heads/main/tickets.json';
  try{
    var response=await fetch(GITHUB_TICKETS_URL);
    if(response.ok){
      state.tickets=await response.json();
      return;
    }
  }catch(e){}
  try{
    var response=await fetch('./tickets.json');
    if(response.ok){
      state.tickets=await response.json();
      return;
    }
  }catch(e){}
  state.tickets={'MC7X9K2P':{w:0},'ZT4N8W1Q':{w:10}};
}

async function loadAllData(){
  state.loading=true;
  render();
  
  await loadTickets();
  
  var ordersResult=await supabaseQuery('orders?order=created_at.desc&limit=100','GET');
  if(ordersResult){
    state.orders=ordersResult.map(function(o){
      return{
        id:o.order_id,
        user:o.user_name,
        userId:o.user_id,
        items:o.items,
        subtotal:o.subtotal,
        discount:o.discount,
        total:o.total,
        promos:o.promos,
        comment:o.comment,
        date:o.order_date,
        created_at:o.created_at
      };
    });
  }
  
  var scratchesResult=await supabaseQuery('scratches?order=created_at.desc&limit=200','GET');
  if(scratchesResult){
    state.scratches=scratchesResult.map(function(s){
      return{
        id:s.scratch_id,
        user:s.user_name,
        userId:s.user_id,
        code:s.ticket_code,
        win:s.win_amount,
        date:s.scratch_date,
        created_at:s.created_at
      };
    });
  }
  
  try{
    var status=await window.storage.get('taverne_status');
    if(status&&status.value)state.taverneStatus=status.value;
  }catch(e){}
  
  state.loading=false;
  render();
}

async function toggleTaverneStatus(){
  state.taverneStatus=state.taverneStatus==='open'?'closed':'open';
  try{
    await window.storage.set('taverne_status',state.taverneStatus);
    alert('✅ Statut modifié : '+(state.taverneStatus==='open'?'OUVERT':'FERMÉ'));
  }catch(e){
    alert('❌ Erreur lors de la modification du statut');
  }
  render();
}

function checkAuth(){
  var savedAuth=localStorage.getItem('admin_auth');
  if(savedAuth===ADMIN_PASSWORD){
    state.authenticated=true;
    loadAllData();
  }else{
    state.authenticated=false;
    state.loading=false;
  }
  render();
}

function login(){
  var password=document.getElementById('password').value;
  if(password===ADMIN_PASSWORD){
    state.authenticated=true;
    localStorage.setItem('admin_auth',password);
    loadAllData();
  }else{
    alert('❌ Mot de passe incorrect !');
  }
}

function logout(){
  state.authenticated=false;
  localStorage.removeItem('admin_auth');
  render();
}

function render(){
  var app=document.getElementById('app');
  
  if(!state.authenticated){
    app.innerHTML='<div class="min-h-screen flex items-center justify-center px-4"><div class="card p-8 max-w-md w-full"><div class="text-center mb-8"><div class="text-6xl mb-4">🔐</div><h1 class="text-3xl font-black text-gray-900 mb-2">Admin Panel</h1><p class="text-gray-600">Taverne McCain</p></div><div class="space-y-4"><input type="password" id="password" placeholder="Mot de passe" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg text-center font-mono text-lg focus:border-indigo-500 focus:outline-none transition" onkeypress="if(event.key===\'Enter\')login()"><button onclick="login()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-3 rounded-lg text-lg transition shadow-lg">🔓 Se Connecter</button></div><div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200"><p class="text-xs text-blue-800 text-center">Accès réservé aux administrateurs</p></div></div></div>';
    return;
  }
  
  if(state.loading){
    app.innerHTML='<div class="min-h-screen flex items-center justify-center"><div class="text-center"><div class="text-6xl mb-4 animate-bounce">⏳</div><p class="text-white text-xl font-bold">Chargement des données...</p></div></div>';
    return;
  }
  
  var usedCodes=state.scratches.map(function(s){return s.code});
  var unusedCodes=[];
  for(var code in state.tickets){
    if(usedCodes.indexOf(code)===-1){
      unusedCodes.push({code:code,gain:state.tickets[code].w});
    }
  }
  
  var totalRevenue=state.orders.reduce(function(sum,o){return sum+parseFloat(o.total)},0);
  var totalWins=state.scratches.reduce(function(sum,s){return sum+s.win},0);
  
  app.innerHTML='<div class="min-h-screen py-8 px-4"><div class="max-w-7xl mx-auto"><div class="bg-gradient-to-r from-indigo-600 to-purple-700 text-white p-8 rounded-2xl shadow-2xl mb-8"><div class="flex items-center justify-between flex-wrap gap-4"><div class="flex items-center gap-4"><div class="text-6xl">👑</div><div><h1 class="text-4xl font-black mb-2">Panel Administrateur</h1><p class="text-indigo-200">Gestion Taverne McCain</p></div></div><button onclick="logout()" class="bg-white/20 hover:bg-white/30 text-white px-6 py-3 rounded-lg font-bold transition">🚪 Déconnexion</button></div></div><div class="grid lg:grid-cols-4 gap-6 mb-8"><div class="card p-6"><div class="flex items-center gap-4"><div class="text-4xl">💰</div><div class="flex-1"><p class="text-sm text-gray-600 font-semibold">Revenus Total</p><p class="text-3xl font-black text-green-600">'+totalRevenue.toFixed(2)+'€</p></div></div></div><div class="card p-6"><div class="flex items-center gap-4"><div class="text-4xl">🎰</div><div class="flex-1"><p class="text-sm text-gray-600 font-semibold">Gains Distribués</p><p class="text-3xl font-black text-red-600">'+totalWins.toFixed(2)+'€</p></div></div></div><div class="card p-6"><div class="flex items-center gap-4"><div class="text-4xl">📦</div><div class="flex-1"><p class="text-sm text-gray-600 font-semibold">Commandes</p><p class="text-3xl font-black text-blue-600">'+state.orders.length+'</p></div></div></div><div class="card p-6"><div class="flex items-center gap-4"><div class="text-4xl">🎫</div><div class="flex-1"><p class="text-sm text-gray-600 font-semibold">Tickets Grattés</p><p class="text-3xl font-black text-purple-600">'+state.scratches.length+'</p></div></div></div></div><div class="grid lg:grid-cols-2 gap-6 mb-8"><div class="card p-6"><h2 class="text-2xl font-black text-gray-900 mb-4 flex items-center gap-3"><span>🎛️</span> Gestion Taverne</h2><div class="bg-gray-50 p-6 rounded-lg border-2 border-gray-300"><p class="font-bold text-gray-900 mb-3">Statut Actuel</p><div class="flex items-center justify-between mb-4"><span class="text-3xl font-black '+(state.taverneStatus==='open'?'text-green-600':'text-red-600')+'">'+(state.taverneStatus==='open'?'🟢 OUVERT':'🔴 FERMÉ')+'</span><button onclick="toggleTaverneStatus()" class="px-6 py-3 '+(state.taverneStatus==='open'?'bg-red-600 hover:bg-red-700':'bg-green-600 hover:bg-green-700')+' text-white font-bold rounded-lg transition">'+(state.taverneStatus==='open'?'Fermer':'Ouvrir')+' la Taverne</button></div><p class="text-sm text-gray-600">Le statut apparaît sur la page d\'accueil pour informer les visiteurs</p></div></div><div class="card p-6"><h2 class="text-2xl font-black text-gray-900 mb-4 flex items-center gap-3"><span>📊</span> Statistiques Tickets</h2><div class="grid grid-cols-2 gap-4"><div class="bg-green-50 p-5 rounded-xl border-2 border-green-300 text-center"><p class="text-sm text-green-700 font-bold mb-2">Tickets Disponibles</p><p class="text-4xl font-black text-green-600">'+unusedCodes.length+'</p></div><div class="bg-red-50 p-5 rounded-xl border-2 border-red-300 text-center"><p class="text-sm text-red-700 font-bold mb-2">Tickets Utilisés</p><p class="text-4xl font-black text-red-600">'+usedCodes.length+'</p></div></div></div></div><div class="grid lg:grid-cols-2 gap-6 mb-8"><div class="card p-6"><h2 class="text-2xl font-black text-gray-900 mb-4 flex items-center gap-3"><span>✅</span> Tickets Disponibles <span class="text-lg font-normal text-gray-600">('+unusedCodes.length+')</span></h2><div class="bg-gray-50 p-4 rounded-lg max-h-96 overflow-y-auto"><div class="grid grid-cols-2 gap-3">'+unusedCodes.map(function(t){return'<div class="bg-white p-4 rounded-lg border-2 '+(t.gain>0?'border-green-400 bg-green-50':'border-gray-300')+'"><p class="font-mono font-black text-sm mb-1">'+t.code+'</p><p class="text-xs '+(t.gain>0?'text-green-700 font-bold':'text-gray-500')+'">Gain: '+(t.gain>0?t.gain+'€':'0€')+'</p></div>'}).join('')+'</div></div></div><div class="card p-6"><h2 class="text-2xl font-black text-gray-900 mb-4 flex items-center gap-3"><span>❌</span> Tickets Utilisés <span class="text-lg font-normal text-gray-600">('+state.scratches.length+')</span></h2><div class="bg-gray-50 p-4 rounded-lg max-h-96 overflow-y-auto"><div class="space-y-2">'+state.scratches.map(function(s){return'<div class="bg-white p-3 rounded-lg border-2 '+(s.win>0?'border-green-400 bg-green-50':'border-gray-300')+'"><div class="flex items-center justify-between mb-1"><p class="font-mono font-bold text-sm">'+s.code+'</p><p class="text-xs '+(s.win>0?'text-green-700 font-bold':'text-gray-500')+'">'+(s.win>0?'+'+s.win+'€':'0€')+'</p></div><p class="text-xs text-gray-600">Par: <strong>'+s.user+'</strong></p><p class="text-xs text-gray-500">'+new Date(s.created_at).toLocaleString('fr-FR')+'</p></div>'}).join('')+'</div></div></div></div><div class="card p-6 mb-8"><h2 class="text-2xl font-black text-gray-900 mb-4 flex items-center gap-3"><span>📦</span> Commandes Récentes <span class="text-lg font-normal text-gray-600">('+state.orders.length+')</span></h2><div class="bg-gray-50 p-4 rounded-lg max-h-96 overflow-y-auto"><div class="space-y-3">'+state.orders.map(function(o){return'<div class="bg-white p-4 rounded-lg border-2 border-blue-300"><div class="flex items-center justify-between mb-3"><div><p class="font-bold text-gray-900">'+o.user+'</p><p class="text-xs text-gray-600">'+new Date(o.created_at).toLocaleString('fr-FR')+'</p></div><p class="text-2xl font-black text-blue-600">'+o.total.toFixed(2)+'€</p></div><div class="border-t border-gray-200 pt-2 mt-2"><p class="text-xs text-gray-700 font-semibold mb-1">Articles:</p>'+o.items.map(function(item){return'<p class="text-xs text-gray-600">'+item.emoji+' '+item.name+' x'+item.quantity+' - '+(item.price*item.quantity).toFixed(2)+'€</p>'}).join('')+(o.comment!=='Aucun'?'<p class="text-xs text-gray-500 mt-2 italic">💬 '+o.comment+'</p>':'')+'</div></div>'}).join('')+'</div></div></div></div></div>';
}

window.addEventListener('load',function(){
  checkAuth();
});
</script>
</body>
</html>
