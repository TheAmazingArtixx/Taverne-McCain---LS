</style>

<body>
<div id="app"></div>
<script>
var SUPABASE_URL='https://laigpbuffioclbujqpdn.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhaWdwYnVmZmlvY2xidWpxcGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzNDA0NjYsImV4cCI6MjA3OTkxNjQ2Nn0.j3elynhftD_GobG3YW3Pc2qMSULmqAOjAlS4nfmkn04';

var ADMIN_PASSWORD_HASH='4dbac38ee1fa3f47a9a4400367e9fcb98e178310bc7548611f7949921902f06f';
var SALT='TaverneMcCain2024SecureAdmin';

var state={authenticated:false,loading:true,orders:[],scratches:[],tickets:{},taverneStatus:'open',loginAttempts:0,lockoutUntil:null};

async function hashPassword(password){
  var encoder=new TextEncoder();
  var saltedPassword=password+SALT;
  var data=encoder.encode(saltedPassword);
  var hashBuffer=await crypto.subtle.digest('SHA-256',data);
  var hashArray=Array.from(new Uint8Array(hashBuffer));
  var hashHex=hashArray.map(function(b){return b.toString(16).padStart(2,'0')}).join('');
  return hashHex;
}

async function supabaseQuery(endpoint,method,data){
  try{
    var options={
      method:method,
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      }
    };
    if(data)options.body=JSON.stringify(data);
    var response=await fetch(SUPABASE_URL+'/rest/v1/'+endpoint,options);
    if(response.ok){
      var result=await response.json();
      return result;
    }
    console.error('Erreur Supabase:',response.status);
    return null;
  }catch(e){
    console.error('Erreur Supabase:',e);
    return null;
  }
}

async function loadTickets(){
  var GITHUB_TICKETS_URL='https://raw.githubusercontent.com/TheAmazingArtixx/Taverne-McCain---LS/refs/heads/main/tickets.json';
  try{
    var response=await fetch(GITHUB_TICKETS_URL);
    if(response.ok){
      state.tickets=await response.json();
      console.log('✅ Tickets chargés depuis GitHub:',Object.keys(state.tickets).length,'tickets');
      return;
    }
  }catch(e){
    console.error('Erreur GitHub:',e);
  }
  try{
    var response=await fetch('./tickets.json');
    if(response.ok){
      state.tickets=await response.json();
      console.log('✅ Tickets chargés depuis fichier local');
      return;
    }
  }catch(e){
    console.error('Erreur fichier local:',e);
  }
  state.tickets={};
  console.warn('⚠️ Aucun ticket chargé');
}

async function loadAllData(){
  state.loading=true;
  render();
  
  await loadTickets();
  
  var ordersResult=await supabaseQuery('orders?order=created_at.desc&limit=100','GET');
  if(ordersResult){
    state.orders=ordersResult.map(function(o){
      return{
        id:o.order_id,
        user:o.user_name,
        userId:o.user_id,
        items:o.items,
        subtotal:o.subtotal,
        discount:o.discount,
        total:o.total,
        promos:o.promos,
        comment:o.comment,
        date:o.order_date,
        created_at:o.created_at
      };
    });
  }
  
  var scratchesResult=await supabaseQuery('scratches?order=created_at.desc&limit=500','GET');
  if(scratchesResult){
    state.scratches=scratchesResult.map(function(s){
      return{
        id:s.scratch_id,
        user:s.user_name,
        userId:s.user_id,
        code:s.ticket_code,
        win:s.win_amount,
        date:s.scratch_date,
        created_at:s.created_at
      };
    });
    console.log('✅ Tickets grattés chargés:',state.scratches.length);
  }
  
  try{
    var status=await window.storage.get('taverne_status',true);
    if(status&&status.value){
      state.taverneStatus=status.value;
    }else{
      var localStatus=localStorage.getItem('taverne_status');
      if(localStatus)state.taverneStatus=localStatus;
    }
  }catch(e){
    var localStatus=localStorage.getItem('taverne_status');
    if(localStatus)state.taverneStatus=localStatus;
  }
  
  state.loading=false;
  render();
}

async function deleteOrder(orderId){
  if(!confirm('⚠️ Êtes-vous sûr de vouloir supprimer cette commande ?')){
    return;
  }
  
  try{
    var response=await fetch(SUPABASE_URL+'/rest/v1/orders?order_id=eq.'+orderId,{
      method:'DELETE',
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json'
      }
    });
    
    if(response.ok){
      alert('✅ Commande supprimée avec succès !');
      loadAllData();
    }else{
      alert('❌ Erreur lors de la suppression');
    }
  }catch(e){
    alert('❌ Erreur réseau: '+e.message);
  }
}

async function deleteScratch(scratchId){
  if(!confirm('⚠️ Êtes-vous sûr de vouloir supprimer ce ticket gratté ?')){
    return;
  }
  
  try{
    var response=await fetch(SUPABASE_URL+'/rest/v1/scratches?scratch_id=eq.'+scratchId,{
      method:'DELETE',
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json'
      }
    });
    
    if(response.ok){
      alert('✅ Ticket supprimé avec succès !');
      loadAllData();
    }else{
      alert('❌ Erreur lors de la suppression');
    }
  }catch(e){
    alert('❌ Erreur réseau: '+e.message);
  }
}

async function toggleTaverneStatus(){
  state.taverneStatus=state.taverneStatus==='open'?'closed':'open';
  
  var configData={
    key:'taverne_status',
    value:state.taverneStatus,
    updated_at:new Date().toISOString()
  };
  
  try{
    var updateResult=await fetch(SUPABASE_URL+'/rest/v1/config?key=eq.taverne_status',{
      method:'PATCH',
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      },
      body:JSON.stringify({value:state.taverneStatus,updated_at:new Date().toISOString()})
    });
    
    if(!updateResult.ok){
      await fetch(SUPABASE_URL+'/rest/v1/config',{
        method:'POST',
        headers:{
          'apikey':SUPABASE_KEY,
          'Authorization':'Bearer '+SUPABASE_KEY,
          'Content-Type':'application/json',
          'Prefer':'return=representation'
        },
        body:JSON.stringify(configData)
      });
    }
  }catch(e){
    console.error('Erreur Supabase:',e);
  }
  
  try{
    await window.storage.set('taverne_status',state.taverneStatus,true);
    localStorage.setItem('taverne_status',state.taverneStatus);
  }catch(e){}
  
  alert('✅ Statut modifié : '+(state.taverneStatus==='open'?'🟢 OUVERT':'🔴 FERMÉ'));
  render();
}

async function checkAuth(){
  var savedAuthHash=localStorage.getItem('admin_auth_token');
  if(savedAuthHash&&savedAuthHash===ADMIN_PASSWORD_HASH){
    state.authenticated=true;
    state.loginAttempts=0;
    state.lockoutUntil=null;
    loadAllData();
  }else{
    state.authenticated=false;
    state.loading=false;
  }
  render();
}

async function login(){
  var password=document.getElementById('password').value;
  
  if(state.lockoutUntil&&Date.now()<state.lockoutUntil){
    var remainingTime=Math.ceil((state.lockoutUntil-Date.now())/1000);
    alert('🚫 Compte temporairement verrouillé. Réessayez dans '+remainingTime+' secondes.');
    return;
  }
  
  await new Promise(function(resolve){setTimeout(resolve,500)});
  
  if(state.loginAttempts>=5){
    state.lockoutUntil=Date.now()+(5*60*1000);
    localStorage.setItem('lockout_until',state.lockoutUntil);
    alert('🚫 Trop de tentatives échouées. Compte verrouillé pendant 5 minutes.');
    render();
    return;
  }
  
  var passwordHash=await hashPassword(password);
  
  if(passwordHash===ADMIN_PASSWORD_HASH){
    state.authenticated=true;
    state.loginAttempts=0;
    state.lockoutUntil=null;
    localStorage.removeItem('lockout_until');
    localStorage.removeItem('login_attempts');
    localStorage.setItem('admin_auth_token',passwordHash);
    console.info('🔓 Connexion réussie');
    loadAllData();
  }else{
    state.loginAttempts++;
    localStorage.setItem('login_attempts',state.loginAttempts);
    
    if(state.loginAttempts<5){
      alert('❌ Mot de passe incorrect !');
    }else{
      state.lockoutUntil=Date.now()+(5*60*1000);
      localStorage.setItem('lockout_until',state.lockoutUntil);
      alert('🚫 Trop de tentatives échouées. Compte verrouillé pendant 5 minutes.');
    }
    render();
  }
}

function logout(){
  state.authenticated=false;
  localStorage.removeItem('admin_auth_token');
  localStorage.removeItem('login_attempts');
  localStorage.removeItem('lockout_until');
  state.loginAttempts=0;
  state.lockoutUntil=null;
  console.info('🔒 Déconnexion');
  render();
}

function render(){
  var app=document.getElementById('app');
  
  if(!state.authenticated){
    var lockoutMessage='';

      var remainingTime=Math.ceil((state.lockoutUntil-Date.now())/1000);

    }

    if(state.lockoutUntil&&Date.now()<state.lockoutUntil){
      setTimeout(render,1000);
    }
    return;
  }
  
  if(state.loading){
    app.innerHTML='<div class="min-h-screen flex items-center justify-center"><div class="text-center"><div class="text-6xl mb-4 animate-bounce">⏳</div><p class="text-white text-xl font-bold">Chargement des données...</p></div></div>';
    return;
  }
  
  var scratchedCodes=state.scratches.map(function(s){return s.code});
  var unusedCodes=[];
  var usedCodesWithDetails=[];
  
  for(var code in state.tickets){
    var ticketGain=state.tickets[code].w;
    var scratchInfo=state.scratches.find(function(s){return s.code===code});
    
    if(scratchInfo){
      usedCodesWithDetails.push({
        code:code,
        expectedGain:ticketGain,
        scratchedBy:scratchInfo.user,
        scratchedAt:scratchInfo.created_at,
        wonAmount:scratchInfo.win
      });
    }else{
      unusedCodes.push({
        code:code,
        gain:ticketGain
      });
    }
  }
  
  var totalRevenue=state.orders.reduce(function(sum,o){return sum+parseFloat(o.total)},0);
  var totalWins=state.scratches.reduce(function(sum,s){return sum+s.win},0);
  var totalPotentialWins=unusedCodes.reduce(function(sum,t){return sum+t.gain},0);
  
  app.innerHTML='<div class="min-h-screen py-8 px-4"><div class="max-w-7xl mx-auto"><div class="bg-gradient-to-r from-indigo-600 to-purple-700 text-white p-8 rounded-2xl shadow-2xl mb-8"><div class="flex items-center justify-between flex-wrap gap-4"><div class="flex items-center gap-4"><div class="text-6xl">👑</div><div><h1 class="text-4xl font-black mb-2">Panel Administrateur</h1><p class="text-indigo-200">Gestion Taverne McCain</p></div></div><button onclick="logout()" class="bg-white/20 hover:bg-white/30 text-white px-6 py-3 rounded-lg font-bold transition">🚪 Déconnexion</button></div></div><div class="grid lg:grid-cols-4 gap-6 mb-8"><div class="card p-6"><div class="flex items-center gap-4"><div class="text-4xl">💰</div><div class="flex-1"><p class="text-sm text-gray-600 font-semibold">Revenus Total</p><p class="text-3xl font-black text-green-600">'+totalRevenue.toFixed(2)+'€</p></div></div></div><div class="card p-6"><div class="flex items-center gap-4"><div class="text-4xl">🎰</div><div class="flex-1"><p class="text-sm text-gray-600 font-semibold">Gains Distribués</p><p class="text-3xl font-black text-red-600">'+totalWins.toFixed(2)+'€</p></div></div></div><div class="card p-6"><div class="flex items-center gap-4"><div class="text-4xl">💎</div><div class="flex-1"><p class="text-sm text-gray-600 font-semibold">Gains Potentiels</p><p class="text-3xl font-black text-orange-600">'+totalPotentialWins.toFixed(2)+'€</p></div></div></div><div class="card p-6"><div class="flex items-center gap-4"><div class="text-4xl">📦</div><div class="flex-1"><p class="text-sm text-gray-600 font-semibold">Commandes</p><p class="text-3xl font-black text-blue-600">'+state.orders.length+'</p></div></div></div></div><div class="grid lg:grid-cols-2 gap-6 mb-8"><div class="card p-6"><h2 class="text-2xl font-black text-gray-900 mb-4 flex items-center gap-3"><span>🎛️</span> Gestion Taverne</h2><div class="bg-gray-50 p-6 rounded-lg border-2 border-gray-300"><p class="font-bold text-gray-900 mb-3" onAmount>0?'border-green-200':'border-red-200')+' pt-2 space-y-1"><div class="flex justify-between text-xs"><span class="text-gray-600">Gain théorique:</span><span class="font-bold '+(t.expectedGain>0?'text-orange-600':'text-gray-500')+'">'+(t.expectedGain>0?t.expectedGain+'€':'0€')+'</span></div><div class="flex justify-between text-xs"><span class="text-gray-600">Gain obtenu:</span><span class="font-bold '+(t.wonAmount>0?'text-green-700':'text-gray-500')+'">'+(t.wonAmount>0?t.wonAmount+'€':'0€')+'</span></div><div class="mt-2 pt-2 border-t '+(t.wonAmount>0?'border-green-200':'border-red-200')+'"><p class="text-xs text-gray-600">Gratté par:</p><p class="text-xs font-bold text-gray-900">'+t.scratchedBy+'</p><p class="text-xs text-gray-500 mt-1">'+new Date(t.scratchedAt).toLocaleString('fr-FR')+'</p></div></div></div>'}).join(''))+'</div></div></div></div><div class="card p-6 mb-8"><h2 class="text-2xl font-black text-gray-900 mb-4 flex items-center gap-3"><span>📦</span> Commandes Récentes <span class="text-lg font-normal text-gray-600">('+state.orders.length+')</span></h2><div class="bg-gray-50 p-4 rounded-lg max-h-96 overflow-y-auto">'+(state.orders.length===0?'<p class="text-center text-gray-500 py-8">Aucune commande pour le moment</p>':'<div class="space-y-3">'+state.orders.map(function(o){return'<div class="bg-white p-4 rounded-lg border-2 border-blue-300"><div class="flex items-center justify-between mb-3"><div class="flex-1"><p class="font-bold text-gray-900">'+o.user+'</p><p class="text-xs text-gray-600">'+new Date(o.created_at).toLocaleString('fr-FR')+'</p></div><div class="flex items-center gap-3"><p class="text-2xl font-black text-blue-600">'+o.total.toFixed(2)+'€</p><button onclick="deleteOrder(\''+o.id+'\')" class="text-red-600 hover:text-red-800 font-bold text-sm px-3 py-2 bg-red-100 hover:bg-red-200 rounded transition" title="Supprimer la commande">🗑️ Supprimer</button></div></div><div class="border-t border-gray-200 pt-2 mt-2"><p class="text-xs text-gray-700 font-semibold mb-1">Articles:</p>'+o.items.map(function(item){return'<p class="text-xs text-gray-600">'+item.emoji+' '+item.name+' x'+item.quantity+' - '+(item.price*item.quantity).toFixed(2)+'€</p>'}).join('')+(o.comment!=='Aucun'?'<p class="text-xs text-gray-500 mt-2 italic">💬 '+o.comment+'</p>':'')+'</div></div>'}).join('')+'</div>')+'</div></div></div></div>';
}

window.addEventListener('load',function(){
  checkAuth();
});
</script>
