// Fonctions Supabase
async function supabaseQuery(endpoint,method,data){
  if(!SUPABASE_URL||SUPABASE_URL==='YOUR_SUPABASE_URL'){
    console.warn('Supabase non configuré, utilisation du stockage local');
    return null;
  }
  try{
    var response=await fetch(SUPABASE_URL+'/rest/v1/'+endpoint,{
      method:method,
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      },
      body:data?JSON.stringify(data):undefined
    });
    if(response.ok)return await response.json();
    return null;
  }catch(e){
    console.error('Erreur Supabase:',e);
    return null;
  }
}

async function saveOrderToSupabase(order){
  var result=await supabaseQuery('orders','POST',order);
  if(!result){
    // Fallback sur le stockage local
    orderData.unshift(order);
    await saveOrders();
  }
}

async function loadOrdersFromSupabase(userId){
  var result=await supabaseQuery('orders?userId=eq.'+userId+'&order=created_at.desc','GET');
  if(result&&result.length>0){
    return result;
  }
  return orderData.filter(function(o){return o.userId===userId});
}

async function loadData(){
  try{
    var o=await window.storage.get('taverne_orders');
    if(o&&o.value)orderData=JSON.parse(o.value);
  }catch(e){}
  try{
    var s=await window.storage.get('taverne_scratch');
    if(s&&s.value)globalScratched=JSON.parse(s.value);
  }catch(e){}
}

async function saveOrders(){
  try{await window.storage.set('taverne_orders',JSON.stringify(orderData))}catch(e){}
}

async function saveScratch(){
  try{await window.storage.set('taverne_scratch',JSON.stringify(globalScratched))}catch(e){}
}

function addCart(p){var e=state.cart.find(function(i){return i.id===p.id});if(e)e.quantity++;else state.cart.push(Object.assign({},p,{quantity:1}));render()}

function calcSub(){return state.cart.reduce(function(s,i){return s+(i.price*i.quantity)},0)}

function calcDisc(){var total=0;state.promos.forEach(function(p){total+=promoCodes[p]||0});return calcSub()*(total/100)}

function calcTotal(){return calcSub()-calcDisc()}

function generateNums(){var n=[];for(var i=0;i<20;i++)n.push(Math.floor(Math.random()*90)+10);return n}

function startScratch(){

    for(var j=0;j<Math.min(3,6);j++){
      nums[replaceIdx]=w[j];
      replaceIdx=(replaceIdx+4)%20;
    }
  }
  state.winNums=w;
  state.yourNums=nums;
  state.win=t.w;

function initCanvas(){
  canvas=document.getElementById('canvas');
  if(!canvas)return;
  ctx=canvas.getContext('2d');
  canvas.width=canvas.parentElement.offsetWidth;
  canvas.height=canvas.parentElement.offsetHeight;
  
  // Surface à gratter grise sobre
  ctx.fillStyle='#9ca3af';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  ctx.font='bold 20px Inter';
  ctx.fillStyle='#374151';
  ctx.textAlign='center';
  ctx.fillText('GRATTEZ POUR RÉVÉLER',canvas.width/2,canvas.height/2-10);
  ctx.font='28px Arial';
  ctx.fillText('🎫',canvas.width/2,canvas.height/2+25);
  
  canvas.addEventListener('mousedown',function(){down=true});
  canvas.addEventListener('mouseup',function(){down=false});
  canvas.addEventListener('mousemove',scratch);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();down=true});
  canvas.addEventListener('touchend',function(){down=false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();scratch(e.touches[0])})
}

function scratch(e){
  if(!down)return;
  var r=canvas.getBoundingClientRect(),x=(e.clientX||e.pageX)-r.left,y=(e.clientY||e.pageY)-r.top;
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();
  ctx.arc(x,y,35,0,Math.PI*2);
  ctx.fill();
  check()
}

function check(){
  var d=ctx.getImageData(0,0,canvas.width,canvas.height).data,t=0;
  for(var i=3;i<d.length;i+=4)if(d[i]===0)t++;
  pct=(t/(d.length/4))*100;
  if(pct>99)reveal()
}

  }else if(state.page==='scratch'){
    if(!state.scratching){
      app.innerHTML=nav+'<div class="container mx-auto px-4 py-8"><div class="max-w-2xl mx-auto"><div class="card p-8"><h2 class="text-3xl font-bold text-gray-900 text-center mb-6">🎰 Gratter un Ticket</h2><div class="bg-gray-50 p-6 rounded-lg border border-gray-200 mb-6"><p class="text-center text-lg mb-4 font-semibold text-gray-800">Entrez votre code ticket</p><input type="text" value="'+state.code+'" oninput="state.code=this.value.toUpperCase()" placeholder="Code fourni par le vendeur" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg mb-4 text-center text-lg font-bold uppercase focus:border-gray-500 focus:outline-none" maxlength="8"><button onclick="startScratch()" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-4 rounded-lg text-xl transition">🎫 Gratter le Ticket</button></div><div class="text-center text-sm text-gray-500"><p class="mb-2">💰 Gains possibles: 10€, 50€, 100€, 500€</p><p class="text-xs">Grattez jusqu\'à révéler tous les numéros</p></div></div><div class="card p-6 mt-6"><button onclick="state.page=\'scratchList\';render()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 rounded-lg transition">📊 Voir l\'Historique</button></div></div></div>'
    }else{
      app.innerHTML=nav+'<div class="container mx-auto px-4 py-8"><div class="max-w-3xl mx-auto"><div class="card p-8"><div class="scratch-ticket"><div class="ticket-header"><div class="price-badge">5€</div><div class="text-center mt-4"><div class="ticket-badge">🍺 Taverne McCain</div></div></div><div class="jackpot-title">JACKPOT</div><div class="jackpot-amount">500€</div><div class="winning-section"><p class="section-title">NUMÉROS GAGNANTS</p><div class="winning-grid">'+state.winNums.map(function(n){return'<div class="winning-item">'+n+'</div>'}).join('')+'</div></div><div class="scratch-section"><p class="section-title">VOS NUMÉROS</p><div class="number-grid">'+state.yourNums.map(function(n){var isWin=state.winNums.indexOf(n)!==-1;return'<div class="money-item '+(isWin?'winner':'')+'">'+n+'</div>'}).join('')+'</div><canvas id="canvas" class="scratch-canvas"></canvas></div><div class="footer-text">Grattez jusqu\'à 99% pour révéler le résultat</div></div></div></div></div>'
    }
  }else if(state.page==='shop'){
    renderShop(app,nav)
  }else if(state.page==='profile'){
    if(!state.user){state.page='home';render();return}
    app.innerHTML=nav+'<div class="container mx-auto px-4 py-8"><div class="max-w-4xl mx-auto"><div class="card p-8 mb-6"><h2 class="text-3xl font-bold text-gray-900 mb-6">👤 Mon Profil</h2><div class="flex items-center gap-4 p-4 bg-gray-50 rounded-lg border border-gray-200 mb-4"><img src="https://cdn.discordapp.com/avatars/'+state.user.id+'/'+state.user.avatar+'.png" class="w-20 h-20 rounded-full shadow-lg border-2 border-gray-300"/><div><p class="font-bold text-2xl text-gray-900">'+state.user.username+'</p><p class="text-gray-600 text-sm">ID: '+state.user.id+'</p></div></div><div class="grid md:grid-cols-2 gap-4"><div class="p-4 bg-gray-50 rounded-lg border border-gray-200"><p class="text-sm text-gray-600 mb-1">Total Commandes</p><p class="font-bold text-2xl text-gray-800">'+state.orderHist.length+'</p></div><div class="p-4 bg-gray-50 rounded-lg border border-gray-200"><p class="text-sm text-gray-600 mb-1">Tickets Grattés</p><p class="font-bold text-2xl text-gray-800">'+globalScratched.filter(function(s){return s.userId===state.user.id}).length+'</p></div></div></div><div class="card p-8"><h3 class="text-2xl font-bold text-gray-900 mb-4">📦 Historique des Commandes</h3>'+(state.orderHist.length===0?'<p class="text-gray-500 text-center py-8">Aucune commande</p>':state.orderHist.map(function(o,i){return'<div class="card p-6 mb-4 border border-gray-200"><div class="flex justify-between items-center mb-4"><div><p class="text-lg font-bold text-gray-900">Commande #'+(state.orderHist.length-i)+'</p><p class="text-sm text-gray-600">'+o.date+'</p></div><p class="text-2xl font-bold text-gray-800">'+o.total+'€</p></div><div class="border-t border-gray-200 pt-4"><p class="font-semibold text-gray-800 mb-2">Articles:</p>'+o.items.map(function(it){return'<p class="text-sm text-gray-600">'+it.emoji+' '+it.name+' x'+it.quantity+' - '+(it.price*it.quantity).toFixed(2)+'€</p>'}).join('')+(o.comment!=='Aucun'?'<div class="mt-3 p-3 bg-gray-50 rounded-lg border border-gray-200"><p class="text-xs text-gray-600 mb-1">Commentaire:</p><p class="text-sm text-gray-700">'+o.comment+'</p></div>':'')+'</div></div>'}).join(''))+'</div></div></div>'
  }
}

function renderShop(app,nav){
  var prods='';
  for(var cat in products){
    var items='';
    products[cat].forEach(function(p){
      items+='<div class="flex items-center justify-between bg-gray-50 p-4 rounded-lg hover:bg-gray-100 transition border border-gray-200"><div class="flex items-center gap-3"><span class="text-3xl">'+p.emoji+'</span><div><p class="font-semibold text-gray-900">'+p.name+'</p><p class="text-sm text-gray-600">'+p.price.toFixed(2)+'€</p></div></div><button onclick="addCart('+JSON.stringify(p).replace(/"/g,'&quot;')+')" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium transition">Ajouter</button></div>'
    });
    prods+='<div class="card p-6"><h2 class="text-2xl font-bold text-gray-900 mb-4 capitalize">'+cat+'</h2><div class="space-y-2">'+items+'</div></div>'
  }
  
  var cart='';
  if(!state.cart.length){
    cart='<p class="text-gray-500 text-center py-8">Votre panier est vide</p>'
  }else{
    var items='';
    state.cart.forEach(function(i){
      items+='<div class="bg-gray-50 p-3 rounded-lg border border-gray-200"><div class="flex justify-between mb-2"><span class="font-semibold text-gray-900">'+i.emoji+' '+i.name+'</span><button onclick="updateQty(\''+i.id+'\',0)" class="text-red-600 hover:text-red-700 font-bold">✕</button></div><div class="flex justify-between items-center"><div class="flex items-center gap-2 bg-white rounded-lg px-3 py-1 border border-gray-300"><button onclick="updateQty(\''+i.id+'\','+(i.quantity-1)+')" class="text-gray-700 font-bold px-2">−</button><span class="font-bold w-8 text-center text-gray-900">'+i.quantity+'</span><button onclick="updateQty(\''+i.id+'\','+(i.quantity+1)+')" class="text-gray-700 font-bold px-2">+</button></div><span class="font-bold text-gray-900">'+(i.price*i.quantity).toFixed(2)+'€</span></div></div>'
    });
    
    var promosHTML='';
    if(state.promos.length>0){
      promosHTML='<div class="space-y-2">'+state.promos.map(function(p){
        return'<div class="flex items-center justify-between bg-green-50 p-2 rounded-lg border border-green-300"><span class="text-green-700 font-bold text-sm">'+p+' (-'+promoCodes[p]+'%)</span><button onclick="removePromo(\''+p+'\')" class="text-red-600 text-xs font-bold">✕</button></div>'
      }).join('')+'</div>'
    }
    
    var disc='';
    if(calcDisc()>0){
      disc='<div class="flex justify-between text-sm text-green-600 font-medium"><span>Réduction:</span><span>-'+calcDisc().toFixed(2)+'€</span></div>'
    }
    
    cart='<div class="space-y-3 mb-4 max-h-80 overflow-y-auto">'+items+'</div><div class="border-t border-gray-200 pt-4 space-y-3"><div class="flex justify-between text-sm text-gray-700"><span>Sous-total:</span><span class="font-medium">'+calcSub().toFixed(2)+'€</span></div><div class="space-y-2"><div class="text-sm font-semibold text-gray-800">Code promo:</div>'+promosHTML+'<div class="flex gap-2"><input type="text" value="'+state.currentPromo+'" onkeypress="promoKeyPress(event)" placeholder="CODE PROMO" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm uppercase focus:border-gray-500 focus:outline-none" maxlength="15"><button onclick="addPromo()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">✓</button></div></div>'+disc+'<div class="flex justify-between text-lg font-bold text-gray-900 border-t border-gray-200 pt-3"><span>Total:</span><span>'+calcTotal().toFixed(2)+'€</span></div><textarea oninput="state.comment=this.value" placeholder="Commentaire (optionnel)" class="w-full px-3 py-2 border border-gray-300 rounded-lg resize-none text-sm focus:border-gray-500 focus:outline-none" rows="2">'+state.comment+'</textarea><button onclick="order()" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-lg transition">Passer Commande</button></div>'
  }
  
  app.innerHTML=nav+'<div class="container mx-auto px-4 py-8"><div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2 space-y-6">'+prods+'</div><div class="lg:col-span-1"><div class="card p-6 sticky top-6"><h2 class="text-2xl font-bold text-gray-900 mb-4">🛒 Panier</h2>'+cart+'</div></div></div></div>'
}

window.addEventListener('load',async function(){
  await loadTickets();
  await loadData();
  getUser();
  render();
});
</script>
</body>
</html>
