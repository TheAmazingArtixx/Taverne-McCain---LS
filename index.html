.winning-section{background:linear-gradient(135deg,#9370DB 0%,#8A2BE2 100%);padding:20px;margin:15px;border-radius:20px;border:5px solid #32CD32}

var promoCodes={'HAPPY20':20,'BIENVENUE':10,'MCCAIN15':15};
var tickets={'MC7X9K2P':{w:0},'ZT4N8W1Q':{w:10},'BV6R3M5L':{w:0},'HJ2D7Y9K':{w:50},'PF8S1X4G':{w:0},'QN3T6Z2M':{w:100},'WR9V5L8H':{w:0},'KD1P7N4B':{w:10},'XG6M2Y9C':{w:0},'LF4W8K3J':{w:500},'TS7R1Q5D':{w:0},'NZ2X9P6V':{w:10},'MH8L4T1W':{w:0},'BC3N7M9R':{w:50},'YK6S2D8F':{w:0},'VJ1Z5W4P':{w:10},'QL9G3X7N':{w:0},'RT4H8M2K':{w:100},'FB7L1Y6C':{w:0},'DW2N9T5Q':{w:10},'PX6V3K8S':{w:0},'ZM1R7J4G':{w:50},'LC9D2P6H':{w:0},'NK4W8X1B':{w:10},'TF7S3Y9V':{w:0},'QG2M5Z8L':{w:100},'HX6N1Q4R':{w:0},'WJ9T7K2D':{w:10},'BP3L8M6C':{w:0},'VR1Y4P9F':{w:500}};
var globalScratched=[];
var orderData=[];
var state={user:null,cart:[],page:'home',promos:[],comment:'',orderHist:[],code:'',scratching:false,win:0,winNums:[],yourNums:[],used:[],currentPromo:''};
var canvas,ctx,down=false,pct=0;

async function loadData(){
  try{
    var o=await window.storage.get('taverne_orders');
    if(o&&o.value)orderData=JSON.parse(o.value);
  }catch(e){}
  try{
    var s=await window.storage.get('taverne_scratch');
    if(s&&s.value)globalScratched=JSON.parse(s.value);
  }catch(e){}
}

async function saveOrders(){
  try{await window.storage.set('taverne_orders',JSON.stringify(orderData))}catch(e){}
}

async function saveScratch(){
  try{await window.storage.set('taverne_scratch',JSON.stringify(globalScratched))}catch(e){}
}

function getUser(){
  var f=new URLSearchParams(window.location.hash.slice(1)),t=f.get('access_token');
  if(t)fetch('https://discord.com/api/users/@me',{headers:{authorization:'Bearer '+t}}).then(function(r){return r.json()}).then(function(u){state.user=u;state.page='welcome';window.location.hash='';render()}).catch(console.error)
}

function login(){window.location.href='https://discord.com/api/oauth2/authorize?client_id='+DISCORD_CLIENT_ID+'&redirect_uri='+encodeURIComponent(REDIRECT_URI)+'&response_type=token&scope=identify'}

function logout(){state={user:null,cart:[],page:'home',promos:[],comment:'',orderHist:[],code:'',scratching:false,win:0,winNums:[],yourNums:[],used:[],currentPromo:''};render()}

function addCart(p){var e=state.cart.find(function(i){return i.id===p.id});if(e)e.quantity++;else state.cart.push(Object.assign({},p,{quantity:1}));render()}

function updateQty(id,q){if(q<=0)state.cart=state.cart.filter(function(i){return i.id!==id});else{var i=state.cart.find(function(i){return i.id===id});if(i)i.quantity=q}render()}

function promoKeyPress(e){if(e.key.length===1&&/[A-Z0-9]/.test(e.key.toUpperCase())){state.currentPromo+=e.key.toUpperCase();render()}}

function addPromo(){var c=state.currentPromo.toUpperCase().trim();if(!c)return;if(promoCodes[c]&&state.promos.indexOf(c)===-1){state.promos.push(c);state.currentPromo='';render()}else if(state.promos.indexOf(c)!==-1){alert('Code déjà utilisé!');state.currentPromo=''}else{alert('Code invalide!');state.currentPromo=''}}

function removePromo(code){state.promos=state.promos.filter(function(p){return p!==code});render()}

function calcSub(){return state.cart.reduce(function(s,i){return s+(i.price*i.quantity)},0)}

function calcDisc(){var total=0;state.promos.forEach(function(p){total+=promoCodes[p]||0});return calcSub()*(total/100)}

function calcTotal(){return calcSub()-calcDisc()}

function order(){
  if(!state.cart.length){alert('Panier vide!');return}
  if(!confirm('Confirmer?\n\nTotal: '+calcTotal().toFixed(2)+'€'))return;
  var username=state.user?state.user.username:'Invité';
  var userId=state.user?state.user.id:'guest';
  var o={id:Date.now(),user:username,userId:userId,items:state.cart,sub:calcSub().toFixed(2),disc:calcDisc().toFixed(2),total:calcTotal().toFixed(2),promos:state.promos.join(', ')||'Aucun',comment:state.comment||'Aucun',date:new Date().toLocaleString('fr-FR')};
  var txt=o.items.map(function(i){return i.emoji+' **'+i.name+'** x'+i.quantity+' - '+(i.price*i.quantity).toFixed(2)+'€'}).join('\n');
  var e={embeds:[{title:'🍺 Commande',color:0xFFA500,fields:[{name:'👤',value:o.user,inline:true},{name:'📅',value:o.date,inline:true},{name:'🍻',value:txt},{name:'💰',value:'Total: **'+o.total+'€**'},{name:'🎟️',value:o.promos}],timestamp:new Date().toISOString()}]};
  if(state.comment!=='Aucun')e.embeds[0].fields.push({name:'💬',value:state.comment});
  fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(e)}).then(function(r){
    if(r.ok){
      orderData.unshift(o);
      saveOrders();
      state.orderHist.unshift(o);
      alert('✅ Commande envoyée!');
      state.cart=[];
      state.promos=[];
      state.comment='';
      state.page='orderHist';
      render();
    }else alert('❌ Erreur')
  }).catch(function(){alert('❌ Erreur')})
}

function generateNums(){var n=[];for(var i=0;i<20;i++)n.push(Math.floor(Math.random()*90)+10);return n}

function startScratch(){
  var c=state.code.toUpperCase().trim();
  if(!c){alert('Entrez un code!');return}
  if(!tickets[c]){alert('❌ Code invalide!');return}
  if(state.used.indexOf(c)!==-1){alert('❌ Code utilisé!');return}
  state.used.push(c);
  var t=tickets[c],w=[],nums=generateNums();
  for(var i=0;i<6;i++)w.push(nums[Math.floor(Math.random()*20)]);
  if(t.w>0){var replaceIdx=Math.floor(Math.random()*20);for(var j=0;j<Math.min(3,6);j++){nums[replaceIdx]=w[j];replaceIdx=(replaceIdx+4)%20}}
  state.winNums=w;
  state.yourNums=nums;
  state.win=t.w;
  state.scratching=true;
  render();
  setTimeout(function(){initCanvas()},100)
}

function initCanvas(){
  canvas=document.getElementById('canvas');
  if(!canvas)return;
  ctx=canvas.getContext('2d');
  canvas.width=canvas.parentElement.offsetWidth;
  canvas.height=canvas.parentElement.offsetHeight;
  var g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  g.addColorStop(0,'#4169E1');
  g.addColorStop(1,'#1E90FF');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font='bold 24px Inter';
  ctx.fillStyle='white';
  ctx.textAlign='center';
  ctx.fillText('GRATTEZ POUR RÉVÉLER',canvas.width/2,canvas.height/2-20);
  ctx.font='40px Arial';
  ctx.fillText('💵',canvas.width/2,canvas.height/2+30);
  canvas.addEventListener('mousedown',function(){down=true});
  canvas.addEventListener('mouseup',function(){down=false});
  canvas.addEventListener('mousemove',scratch);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();down=true});
  canvas.addEventListener('touchend',function(){down=false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();scratch(e.touches[0])})
}

function scratch(e){
  if(!down)return;
  var r=canvas.getBoundingClientRect(),x=(e.clientX||e.pageX)-r.left,y=(e.clientY||e.pageY)-r.top;
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();
  ctx.arc(x,y,40,0,Math.PI*2);
  ctx.fill();
  check()
}

function check(){
  var d=ctx.getImageData(0,0,canvas.width,canvas.height).data,t=0;
  for(var i=3;i<d.length;i+=4)if(d[i]===0)t++;
  pct=(t/(d.length/4))*100;
  if(pct>70)reveal()
}

function reveal(){
  down=false;
  var s={user:state.user?state.user.username:'Invité',userId:state.user?state.user.id:'guest',code:state.code,win:state.win,date:new Date().toLocaleString('fr-FR')};
  globalScratched.push(s);
  saveScratch();
  var e={embeds:[{title:'🎰 Ticket',color:state.win>0?0x00FF00:0xFF0000,fields:[{name:'👤',value:s.user,inline:true},{name:'🎟️',value:s.code,inline:true},{name:state.win>0?'🎉 GAGNÉ!':'😢 Perdu',value:state.win>0?'**'+state.win+'€**':'Pas de gain'},{name:'📅',value:s.date}],timestamp:new Date().toISOString()}]};
  fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(e)});
  setTimeout(function(){
    if(state.win>0)alert('🎉 Gagné '+state.win+'€!');
    else alert('😢 Pas de gain...');
    state.scratching=false;
    state.code='';
    pct=0;
    state.page='scratchList';
    render()
  },500)
}

function login(){window.location.href='https://discord.com/api/oauth2/authorize?client_id='+DISCORD_CLIENT_ID+'&redirect_uri='+encodeURIComponent(REDIRECT_URI)+'&response_type=token&scope=identify'}

function addCart(p){var e=state.cart.find(function(i){return i.id===p.id});if(e)e.quantity++;else state.cart.push(Object.assign({},p,{quantity:1}));render()}

function updateQty(id,q){if(q<=0)state.cart=state.cart.filter(function(i){return i.id!==id});else{var i=state.cart.find(function(i){return i.id===id});if(i)i.quantity=q}render()}

function promoKeyPress(e){if(e.key.length===1&&/[A-Z0-9]/.test(e.key.toUpperCase())){state.currentPromo+=e.key.toUpperCase();render()}}

function addPromo(){var c=state.currentPromo.toUpperCase().trim();if(!c)return;if(promoCodes[c]&&state.promos.indexOf(c)===-1){state.promos.push(c);state.currentPromo='';render()}else if(state.promos.indexOf(c)!==-1){alert('Code déjà utilisé!');state.currentPromo=''}else{alert('Code invalide!');state.currentPromo=''}}

function removePromo(code){state.promos=state.promos.filter(function(p){return p!==code});render()}

function calcSub(){return state.cart.reduce(function(s,i){return s+(i.price*i.quantity)},0)}

function calcDisc(){var total=0;state.promos.forEach(function(p){total+=promoCodes[p]||0});return calcSub()*(total/100)}

function calcTotal(){return calcSub()-calcDisc()}

function generateNums(){var n=[];for(var i=0;i<20;i++)n.push(Math.floor(Math.random()*90)+10);return n}

function startScratch(){
  var c=state.code.toUpperCase().trim();
  if(!c){alert('Entrez un code!');return}
  if(!tickets[c]){alert('❌ Code invalide!');return}
  if(state.used.indexOf(c)!==-1){alert('❌ Code utilisé!');return}
  state.used.push(c);
  var t=tickets[c],w=[],nums=generateNums();
  for(var i=0;i<6;i++)w.push(nums[Math.floor(Math.random()*20)]);
  if(t.w>0){var replaceIdx=Math.floor(Math.random()*20);for(var j=0;j<Math.min(3,6);j++){nums[replaceIdx]=w[j];replaceIdx=(replaceIdx+4)%20}}
  state.winNums=w;
  state.yourNums=nums;
  state.win=t.w;
  state.scratching=true;
  render();
  setTimeout(function(){initCanvas()},100)
}

function initCanvas(){
  canvas=document.getElementById('canvas');
  if(!canvas)return;
  ctx=canvas.getContext('2d');
  canvas.width=canvas.parentElement.offsetWidth;
  canvas.height=canvas.parentElement.offsetHeight;
  var g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  g.addColorStop(0,'#4169E1');
  g.addColorStop(1,'#1E90FF');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font='bold 24px Inter';
  ctx.fillStyle='white';
  ctx.textAlign='center';
  ctx.fillText('GRATTEZ POUR RÉVÉLER',canvas.width/2,canvas.height/2-20);
  ctx.font='40px Arial';
  ctx.fillText('💵',canvas.width/2,canvas.height/2+30);
  canvas.addEventListener('mousedown',function(){down=true});
  canvas.addEventListener('mouseup',function(){down=false});
  canvas.addEventListener('mousemove',scratch);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();down=true});
  canvas.addEventListener('touchend',function(){down=false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();scratch(e.touches[0])})
}

function scratch(e){
  if(!down)return;
  var r=canvas.getBoundingClientRect(),x=(e.clientX||e.pageX)-r.left,y=(e.clientY||e.pageY)-r.top;
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();
  ctx.arc(x,y,40,0,Math.PI*2);
  ctx.fill();
  check()
}

function check(){
  var d=ctx.getImageData(0,0,canvas.width,canvas.height).data,t=0;
  for(var i=3;i<d.length;i+=4)if(d[i]===0)t++;
  pct=(t/(d.length/4))*100;
  if(pct>70)reveal()
}

function reveal(){
  down=false;
  var s={user:state.user?state.user.username:'Invité',userId:state.user?state.user.id:'guest',code:state.code,win:state.win,date:new Date().toLocaleString('fr-FR')};
  globalScratched.push(s);
  saveScratch();
  var e={embeds:[{title:'🎰 Ticket',color:state.win>0?0x00FF00:0xFF0000,fields:[{name:'👤',value:s.user,inline:true},{name:'🎟️',value:s.code,inline:true},{name:state.win>0?'🎉 GAGNÉ!':'😢 Perdu',value:state.win>0?'**'+state.win+'€**':'Pas de gain'},{name:'📅',value:s.date}],timestamp:new Date().toISOString()}]};
  fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(e)});
  setTimeout(function(){
    if(state.win>0)alert('🎉 Gagné '+state.win+'€!');

    state.scratching=false;
    state.code='';
    pct=0;
    state.page='scratchList';
    render()
  },500)
}
