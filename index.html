// Fonctions Supabase
async function supabaseQuery(endpoint,method,data){
  try{
    var options={
      method:method,
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      }
    };
    if(data)options.body=JSON.stringify(data);
    var response=await fetch(SUPABASE_URL+'/rest/v1/'+endpoint,options);
    if(response.ok){
      var result=await response.json();
      return result;
    }
    console.error('Erreur Supabase:',response.status);
    return null;
  }catch(e){
    console.error('Erreur Supabase:',e);
    return null;
  }
}

async function saveOrderToSupabase(order){
  var supabaseOrder={
    order_id:order.id.toString(),
    user_name:order.user,
    user_id:order.userId,
    items:order.items,
    subtotal:parseFloat(order.sub),
    discount:parseFloat(order.disc),
    total:parseFloat(order.total),
    promos:order.promos,
    comment:order.comment,
    order_date:order.date,
    created_at:order.created_at
  };
  var result=await supabaseQuery('orders','POST',supabaseOrder);
  if(result){
    console.log('Commande sauvegardée dans Supabase');
    return true;
  }
  // Fallback sur le stockage local
  orderData.unshift(order);
  await saveOrders();
  return false;
}

async function loadOrdersFromSupabase(userId){
  var result=await supabaseQuery('orders?user_id=eq.'+userId+'&order=created_at.desc','GET');
  if(result&&result.length>0){
    // Convertir le format Supabase vers notre format local
    return result.map(function(o){
      return{
        id:parseInt(o.order_id),
        user:o.user_name,
        userId:o.user_id,
        items:o.items,
        sub:o.subtotal.toFixed(2),
        disc:o.discount.toFixed(2),
        total:o.total.toFixed(2),
        promos:o.promos,
        comment:o.comment,
        date:o.order_date,
        created_at:o.created_at
      };
    });
  }
  // Fallback sur le stockage local
  return orderData.filter(function(o){return o.userId===userId});
}

function generateNums(){var n=[];for(var i=0;i<20;i++)n.push(Math.floor(Math.random()*90)+10);return n}

function startScratch(){
  var c=state.code.toUpperCase().trim();
  if(!c){alert('Veuillez entrer un code ticket!');return}
  if(!tickets[c]){alert('❌ Code invalide ou ticket non trouvé!');return}
  if(state.used.indexOf(c)!==-1){alert('❌ Ce code a déjà été utilisé!');return}
  state.used.push(c);
  var t=tickets[c],w=[],nums=generateNums();
  for(var i=0;i<6;i++)w.push(nums[Math.floor(Math.random()*20)]);
  if(t.w>0){
    var replaceIdx=Math.floor(Math.random()*20);
    for(var j=0;j<Math.min(3,6);j++){
      nums[replaceIdx]=w[j];
      replaceIdx=(replaceIdx+4)%20;
    }
  }
  state.winNums=w;
  state.yourNums=nums;
  state.win=t.w;
  state.scratching=true;
  render();
  setTimeout(function(){initCanvas()},100)
}

function initCanvas(){
  canvas=document.getElementById('canvas');
  if(!canvas)return;
  ctx=canvas.getContext('2d');
  canvas.width=canvas.parentElement.offsetWidth;
  canvas.height=canvas.parentElement.offsetHeight;
  
  // Surface à gratter grise sobre
  ctx.fillStyle='#9ca3af';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  ctx.font='bold 20px Inter';
  ctx.fillStyle='#374151';
  ctx.textAlign='center';
  ctx.fillText('GRATTEZ POUR RÉVÉLER',canvas.width/2,canvas.height/2-10);
  ctx.font='28px Arial';
  ctx.fillText('🎫',canvas.width/2,canvas.height/2+25);
  
  canvas.addEventListener('mousedown',function(){down=true});
  canvas.addEventListener('mouseup',function(){down=false});
  canvas.addEventListener('mousemove',scratch);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();down=true});
  canvas.addEventListener('touchend',function(){down=false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();scratch(e.touches[0])})
}

function scratch(e){
  if(!down)return;
  var r=canvas.getBoundingClientRect(),x=(e.clientX||e.pageX)-r.left,y=(e.clientY||e.pageY)-r.top;
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();
  ctx.arc(x,y,35,0,Math.PI*2);
  ctx.fill();
  check()
}

function check(){
  var d=ctx.getImageData(0,0,canvas.width,canvas.height).data,t=0;
  for(var i=3;i<d.length;i+=4)if(d[i]===0)t++;
  pct=(t/(d.length/4))*100;
  if(pct>99)reveal()
}

    state.scratching=false;
    state.code='';
    pct=0;
    state.page='scratchList';
    render()
  },500)
}
