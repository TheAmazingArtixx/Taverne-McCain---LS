// Fonctions Supabase
async function supabaseQuery(endpoint,method,data){
  try{
    var options={
      method:method,
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      }
    };
    if(data)options.body=JSON.stringify(data);
    var response=await fetch(SUPABASE_URL+'/rest/v1/'+endpoint,options);
    if(response.ok){
      var result=await response.json();
      return result;
    }
    console.error('Erreur Supabase:',response.status);
    return null;
  }catch(e){
    console.error('Erreur Supabase:',e);
    return null;
  }
}

async function saveOrderToSupabase(order){
  var supabaseOrder={
    order_id:order.id.toString(),
    user_name:order.user,
    user_id:order.userId,
    items:order.items,
    subtotal:parseFloat(order.sub),
    discount:parseFloat(order.disc),
    total:parseFloat(order.total),
    promos:order.promos,
    comment:order.comment,
    order_date:order.date,
    created_at:order.created_at
  };
  var result=await supabaseQuery('orders','POST',supabaseOrder);
  if(result){
    console.log('Commande sauvegardée dans Supabase');
    return true;
  }
  // Fallback sur le stockage local
  orderData.unshift(order);
  await saveOrders();
  return false;
}

async function loadOrdersFromSupabase(userId){
  var result=await supabaseQuery('orders?user_id=eq.'+userId+'&order=created_at.desc','GET');
  if(result&&result.length>0){
    // Convertir le format Supabase vers notre format local
    return result.map(function(o){
      return{
        id:parseInt(o.order_id),
        user:o.user_name,
        userId:o.user_id,
        items:o.items,
        sub:o.subtotal.toFixed(2),
        disc:o.discount.toFixed(2),
        total:o.total.toFixed(2),
        promos:o.promos,
        comment:o.comment,
        date:o.order_date,
        created_at:o.created_at
      };
    });
  }
  // Fallback sur le stockage local
  return orderData.filter(function(o){return o.userId===userId});
}

    scratch_id:scratch.id?scratch.id.toString():Date.now().toString(),
    user_name:scratch.user,
    user_id:scratch.userId,
    ticket_code:scratch.code,
    win_amount:scratch.win,
    scratch_date:scratch.date,
    created_at:new Date().toISOString()
  };
  var result=await supabaseQuery('scratches','POST',supabaseScratch);
  if(result){
    console.log('Ticket sauvegardé dans Supabase');
    return true;
  }
  return false;
}

async function loadScratchesFromSupabase(userId){
  var result=await supabaseQuery('scratches?user_id=eq.'+userId+'&order=created_at.desc','GET');
  if(result&&result.length>0){
    return result.map(function(s){
      return{
        id:parseInt(s.scratch_id),
        user:s.user_name,
        userId:s.user_id,
        code:s.ticket_code,
        win:s.win_amount,
        date:s.scratch_date
      };
    });
  }
  return[];
}

async function loadAllScratchesFromSupabase(){
  var result=await supabaseQuery('scratches?order=created_at.desc&limit=100','GET');
  if(result&&result.length>0){
    return result.map(function(s){
      return{
        id:parseInt(s.scratch_id),
        user:s.user_name,
        userId:s.user_id,
        code:s.ticket_code,
        win:s.win_amount,
        date:s.scratch_date
      };
    });
  }
  return globalScratched;
}

async function getUsedTicketsFromSupabase(userId){
  var result=await supabaseQuery('scratches?user_id=eq.'+userId+'&select=ticket_code','GET');
  if(result&&result.length>0){
    return result.map(function(s){return s.ticket_code});
  }
  return[];
}

async function loadData(){
  try{
    var o=await window.storage.get('taverne_orders');
    if(o&&o.value)orderData=JSON.parse(o.value);
  }catch(e){}
  try{
    var s=await window.storage.get('taverne_scratch');
    if(s&&s.value)globalScratched=JSON.parse(s.value);
  }catch(e){}
  // Charger tous les tickets depuis Supabase pour le classement
  var allScratches=await loadAllScratchesFromSupabase();
  if(allScratches.length>0){
    globalScratched=allScratches;
  }
  // Charger le statut de la taverne
  try{
    var status=await window.storage.get('taverne_status');
    if(status&&status.value)state.taverneStatus=status.value;
  }catch(e){}
}

function addCart(p){var e=state.cart.find(function(i){return i.id===p.id});if(e)e.quantity++;else state.cart.push(Object.assign({},p,{quantity:1}));render()}

function updateQty(id,q){if(q<=0)state.cart=state.cart.filter(function(i){return i.id!==id});else{var i=state.cart.find(function(i){return i.id===id});if(i)i.quantity=q}render()}

function promoKeyPress(e){if(e.key==='Enter'){e.preventDefault();addPromo()}}

function addPromo(){var c=state.currentPromo.toUpperCase().trim();if(!c)return;if(promoCodes[c]&&state.promos.indexOf(c)===-1){state.promos.push(c);state.currentPromo='';render()}else if(state.promos.indexOf(c)!==-1){alert('Code déjà utilisé!');state.currentPromo=''}else{alert('Code invalide!');state.currentPromo=''}}

function removePromo(code){state.promos=state.promos.filter(function(p){return p!==code});render()}

function calcSub(){return state.cart.reduce(function(s,i){return s+(i.price*i.quantity)},0)}

function calcDisc(){var total=0;state.promos.forEach(function(p){total+=promoCodes[p]||0});return calcSub()*(total/100)}

function calcTotal(){return calcSub()-calcDisc()}

function generateNums(){var n=[];for(var i=0;i<20;i++)n.push(Math.floor(Math.random()*90)+10);return n}

function startScratch(){
  var c=state.code.toUpperCase().trim();
  if(!c){alert('Veuillez entrer un code ticket!');return}
  if(!tickets[c]){alert('❌ Code invalide ou ticket non trouvé!');return}
  if(tickets[c].used){alert('❌ Ce ticket a déjà été utilisé!');return}
  if(state.used.indexOf(c)!==-1){alert('❌ Vous avez déjà utilisé ce code!');return}
  
  state.used.push(c);
  var t=tickets[c],w=[],nums=generateNums();
  for(var i=0;i<6;i++)w.push(nums[Math.floor(Math.random()*20)]);
  if(t.w>0){
    var replaceIdx=Math.floor(Math.random()*20);
    for(var j=0;j<Math.min(3,6);j++){
      nums[replaceIdx]=w[j];
      replaceIdx=(replaceIdx+4)%20;
    }
  }
  state.winNums=w;
  state.yourNums=nums;
  state.win=t.w;
  state.scratching=true;
  render();
  setTimeout(function(){initCanvas()},100)
}

function initCanvas(){
  canvas=document.getElementById('canvas');
  if(!canvas)return;
  ctx=canvas.getContext('2d');
  canvas.width=canvas.parentElement.offsetWidth;
  canvas.height=canvas.parentElement.offsetHeight;
  
  // Surface à gratter réaliste avec texture
  var gradient=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  gradient.addColorStop(0,'#c0c0c0');
  gradient.addColorStop(0.5,'#a8a8a8');
  gradient.addColorStop(1,'#909090');
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Ajouter une texture granuleuse
  for(var i=0;i<canvas.width*canvas.height/50;i++){
    var x=Math.random()*canvas.width;
    var y=Math.random()*canvas.height;
    var opacity=Math.random()*0.3;
    ctx.fillStyle='rgba(255,255,255,'+opacity+')';
    ctx.fillRect(x,y,1,1);
  }
  
  // Texte et icône
  ctx.font='bold 18px Inter';
  ctx.fillStyle='#4b5563';
  ctx.textAlign='center';
  ctx.shadowColor='rgba(255,255,255,0.5)';
  ctx.shadowBlur=2;
  ctx.fillText('GRATTEZ ICI',canvas.width/2,canvas.height/2-15);
  ctx.font='32px Arial';
  ctx.fillText('🪙',canvas.width/2,canvas.height/2+20);
  ctx.shadowBlur=0;
  
  canvas.addEventListener('mousedown',function(){down=true});
  canvas.addEventListener('mouseup',function(){down=false});
  canvas.addEventListener('mousemove',scratch);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();down=true});
  canvas.addEventListener('touchend',function(){down=false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();scratch(e.touches[0])})
}

function scratch(e){
  if(!down)return;
  var r=canvas.getBoundingClientRect(),x=(e.clientX||e.pageX)-r.left,y=(e.clientY||e.pageY)-r.top;
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();
  ctx.arc(x,y,25,0,Math.PI*2);
  ctx.fill();
  
  // Ajouter des particules de grattage
  for(var i=0;i<3;i++){
    var offsetX=(Math.random()-0.5)*20;
    var offsetY=(Math.random()-0.5)*20;
    ctx.beginPath();
    ctx.arc(x+offsetX,y+offsetY,Math.random()*5+2,0,Math.PI*2);
    ctx.fill();
  }
  
  check()
}

function check(){
  var d=ctx.getImageData(0,0,canvas.width,canvas.height).data,t=0;
  for(var i=3;i<d.length;i+=4)if(d[i]===0)t++;
  pct=(t/(d.length/4))*100;
  if(pct>75&&!state.showResult)reveal()
}

    }
    renderShop(app,nav)
  }else if(state.page==='profile'){
    if(!state.user){state.page='home';render();return}
    // Charger l'historique des tickets grattés par l'utilisateur
    loadScratchesFromSupabase(state.user.id).then(function(userScratches){
      var userScratchesHTML='';
      if(userScratches.length===0){
        userScratchesHTML='<p class="text-gray-500 text-center py-4">Aucun ticket gratté</p>';
      }else{
        userScratchesHTML='<div class="space-y-2">'+userScratches.map(function(s,i){
          return'<div class="flex items-center justify-between p-3 '+(s.win>0?'bg-green-50 border-l-4 border-green-500':'bg-gray-50 border-l-4 border-gray-300')+' rounded-lg"><div><p class="font-semibold text-gray-900">Code: '+s.code+'</p><p class="text-xs text-gray-600">'+s.date+'</p></div><p class="text-xl font-bold '+(s.win>0?'text-green-600':'text-gray-400')+'">'+(s.win>0?'+'+s.win+'€':'0€')+'</p></div>';
        }).join('')+'</div>';
      }
      
      document.getElementById('userScratchHistory').innerHTML=userScratchesHTML;
    });
    
    app.innerHTML=nav+'<div class="container mx-auto px-4 py-8"><div class="max-w-4xl mx-auto"><div class="card p-8 mb-6"><h2 class="text-3xl font-bold text-gray-900 mb-6">👤 Mon Profil</h2><div class="flex items-center gap-4 p-4 bg-gray-50 rounded-lg border border-gray-200 mb-4"><img src="https://cdn.discordapp.com/avatars/'+state.user.id+'/'+state.user.avatar+'.png" class="w-20 h-20 rounded-full shadow-lg border-2 border-gray-300"/><div><p class="font-bold text-2xl text-gray-900">'+state.user.username+'</p><p class="text-gray-600 text-sm">ID: '+state.user.id+'</p></div></div><div class="grid md:grid-cols-2 gap-4"><div class="p-4 bg-gray-50 rounded-lg border border-gray-200"><p class="text-sm text-gray-600 mb-1">Total Commandes</p><p class="font-bold text-2xl text-gray-800">'+state.orderHist.length+'</p></div><div class="p-4 bg-gray-50 rounded-lg border border-gray-200"><p class="text-sm text-gray-600 mb-1">Tickets Grattés</p><p class="font-bold text-2xl text-gray-800">'+state.used.length+'</p></div></div></div><div class="card p-8 mb-6"><h3 class="text-2xl font-bold text-gray-900 mb-4">🎰 Mes Tickets Grattés</h3><div id="userScratchHistory"><p class="text-gray-500 text-center py-4">Chargement...</p></div></div><div class="card p-8"><h3 class="text-2xl font-bold text-gray-900 mb-4">📦 Historique des Commandes</h3>'+(state.orderHist.length===0?'<p class="text-gray-500 text-center py-8">Aucune commande</p>':state.orderHist.map(function(o,i){return'<div class="card p-6 mb-4 border border-gray-200"><div class="flex justify-between items-center mb-4"><div><p class="text-lg font-bold text-gray-900">Commande #'+(state.orderHist.length-i)+'</p><p class="text-sm text-gray-600">'+o.date+'</p></div><p class="text-2xl font-bold text-gray-800">'+o.total+'€</p></div><div class="border-t border-gray-200 pt-4"><p class="font-semibold text-gray-800 mb-2">Articles:</p>'+o.items.map(function(it){return'<p class="text-sm text-gray-600">'+it.emoji+' '+it.name+' x'+it.quantity+' - '+(it.price*it.quantity).toFixed(2)+'€</p>'}).join('')+(o.comment!=='Aucun'?'<div class="mt-3 p-3 bg-gray-50 rounded-lg border border-gray-200"><p class="text-xs text-gray-600 mb-1">Commentaire:</p><p class="text-sm text-gray-700">'+o.comment+'</p></div>':'')+'</div></div>'}).join(''))+'</div></div></div>'
  }
}

function renderShop(app,nav){
  var prods='';
  for(var cat in products){
    var items='';
    products[cat].forEach(function(p){
      items+='<div class="flex items-center justify-between bg-gray-50 p-4 rounded-lg hover:bg-gray-100 transition border border-gray-200"><div class="flex items-center gap-3"><span class="text-3xl">'+p.emoji+'</span><div><p class="font-semibold text-gray-900">'+p.name+'</p><p class="text-sm text-gray-600">'+p.price.toFixed(2)+'€</p></div></div><button onclick="addCart('+JSON.stringify(p).replace(/"/g,'&quot;')+')" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium transition">Ajouter</button></div>'
    });
    prods+='<div class="card p-6"><h2 class="text-2xl font-bold text-gray-900 mb-4 capitalize">'+cat+'</h2><div class="space-y-2">'+items+'</div></div>'
  }
  
  var cart='';
  if(!state.cart.length){
    cart='<p class="text-gray-500 text-center py-8">Votre panier est vide</p>'
  }else{
    var items='';
    state.cart.forEach(function(i){
      items+='<div class="bg-gray-50 p-3 rounded-lg border border-gray-200"><div class="flex justify-between mb-2"><span class="font-semibold text-gray-900">'+i.emoji+' '+i.name+'</span><button onclick="updateQty(\''+i.id+'\',0)" class="text-red-600 hover:text-red-700 font-bold">✕</button></div><div class="flex justify-between items-center"><div class="flex items-center gap-2 bg-white rounded-lg px-3 py-1 border border-gray-300"><button onclick="updateQty(\''+i.id+'\','+(i.quantity-1)+')" class="text-gray-700 font-bold px-2">−</button><span class="font-bold w-8 text-center text-gray-900">'+i.quantity+'</span><button onclick="updateQty(\''+i.id+'\','+(i.quantity+1)+')" class="text-gray-700 font-bold px-2">+</button></div><span class="font-bold text-gray-900">'+(i.price*i.quantity).toFixed(2)+'€</span></div></div>'
    });
    
    var promosHTML='';
    if(state.promos.length>0){
      promosHTML='<div class="space-y-2">'+state.promos.map(function(p){
        return'<div class="flex items-center justify-between bg-green-50 p-2 rounded-lg border border-green-300"><span class="text-green-700 font-bold text-sm">'+p+' (-'+promoCodes[p]+'%)</span><button onclick="removePromo(\''+p+'\')" class="text-red-600 text-xs font-bold">✕</button></div>'
      }).join('')+'</div>'
    }
    
    var disc='';
    if(calcDisc()>0){
      disc='<div class="flex justify-between text-sm text-green-600 font-medium"><span>Réduction:</span><span>-'+calcDisc().toFixed(2)+'€</span></div>'
    }
    
    cart='<div class="space-y-3 mb-4 max-h-80 overflow-y-auto">'+items+'</div><div class="border-t border-gray-200 pt-4 space-y-3"><div class="flex justify-between text-sm text-gray-700"><span>Sous-total:</span><span class="font-medium">'+calcSub().toFixed(2)+'€</span></div><div class="space-y-2"><div class="text-sm font-semibold text-gray-800">Code promo:</div>'+promosHTML+'            <div class="flex gap-2"><input type="text" value="'+state.currentPromo+'" oninput="state.currentPromo=this.value.toUpperCase()" onkeypress="promoKeyPress(event)" placeholder="CODE PROMO" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm uppercase focus:border-gray-500 focus:outline-none" maxlength="15"><button onclick="addPromo()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">✓</button></div></div>'+disc+'<div class="flex justify-between text-lg font-bold text-gray-900 border-t border-gray-200 pt-3"><span>Total:</span><span>'+calcTotal().toFixed(2)+'€</span></div><textarea oninput="state.comment=this.value" placeholder="Commentaire (optionnel)" class="w-full px-3 py-2 border border-gray-300 rounded-lg resize-none text-sm focus:border-gray-500 focus:outline-none" rows="2">'+state.comment+'</textarea><button onclick="order()" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-lg transition">Passer Commande</button></div>'
  }
  
  app.innerHTML=nav+'<div class="container mx-auto px-4 py-8"><div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2 space-y-6">'+prods+'</div><div class="lg:col-span-1"><div class="card p-6 sticky top-6"><h2 class="text-2xl font-bold text-gray-900 mb-4">🛒 Panier</h2>'+cart+'</div></div></div></div>'
}

window.addEventListener('load',async function(){
  await loadTickets();
  await loadData();
  getUser();
  render();
});
</script>
</body>
