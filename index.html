<script>
const DISCORD_CLIENT_ID='1441487940776890511';

const WEBHOOK_URL='https://discord.com/api/webhooks/1441176217700139019/kZ73H7dY-5CXVAJtV4M9gpP7PfXBQ6jSl85pd-2RSttc1aoB80N7SLtWwTJuIc2nOrJz';

const promoCodes={'HAPPY20':20,'BIENVENUE':10,'MCCAIN15':15};

const tickets={

// Stockage persistant
async function saveOrders(){
  try{
    await window.storage.set('taverne_orders',JSON.stringify(orderData));
  }catch(e){console.log('Storage not available, using memory only')}
}

async function loadOrders(){
  try{
    const result=await window.storage.get('taverne_orders');
    if(result&&result.value){
      orderData=JSON.parse(result.value);
    }
  }catch(e){console.log('Loading from memory')}
}

async function saveScratch(){
  try{
    await window.storage.set('taverne_scratch',JSON.stringify(scratchData));
  }catch(e){console.log('Storage not available')}
}

async function loadScratch(){
  try{
    const result=await window.storage.get('taverne_scratch');
    if(result&&result.value){
      scratchData=JSON.parse(result.value);
    }
  }catch(e){console.log('Loading from memory')}
}

function getUser(){
  const params=new URLSearchParams(window.location.hash.slice(1));
  const token=params.get('access_token');
  if(token){
    fetch('https://discord.com/api/users/@me',{
      headers:{authorization:`Bearer ${token}`}
    })
    .then(r=>r.json())
    .then(u=>{
      state.user=u;
      window.location.hash='';
      render();
    })
    .catch(console.error);
  }
}

function login(){
  window.location.href=`https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
}

function logout(){
  state.user=null;
  state.cart=[];
  state.promos=[];
  state.comment='';
  state.page='home';
  render();
}

function addToCart(product){
  const existing=state.cart.find(i=>i.id===product.id);
  if(existing){
    existing.quantity++;
  }else{
    state.cart.push({...product,quantity:1});
  }
  render();
}

function updateQuantity(id,qty){
  if(qty<=0){
    state.cart=state.cart.filter(i=>i.id!==id);
  }else{
    const item=state.cart.find(i=>i.id===id);
    if(item)item.quantity=qty;
  }
  render();
}

function addPromoCode(){
  const code=state.currentPromo.toUpperCase().trim();
  if(!code)return;
  if(promoCodes[code]&&!state.promos.includes(code)){
    state.promos.push(code);
    state.currentPromo='';
    render();
  }else if(state.promos.includes(code)){
    alert('Code déjà utilisé!');
    state.currentPromo='';
  }else{
    alert('Code invalide!');
    state.currentPromo='';
  }
}

function removePromo(code){
  state.promos=state.promos.filter(p=>p!==code);
  render();
}

function calculateSubtotal(){
  return state.cart.reduce((sum,item)=>sum+(item.price*item.quantity),0);
}

function calculateDiscount(){
  const totalPercent=state.promos.reduce((sum,code)=>sum+(promoCodes[code]||0),0);
  return calculateSubtotal()*(totalPercent/100);
}

function calculateTotal(){
  return calculateSubtotal()-calculateDiscount();
}

async function placeOrder(){
  if(!state.cart.length){
    alert('Votre panier est vide!');
    return;
  }
  
  const username=state.user?state.user.username:'Invité';
  const userId=state.user?state.user.id:'guest';
  
  if(!confirm(`Confirmer la commande?\n\nTotal: ${calculateTotal().toFixed(2)}€`))return;
  
  const order={
    id:Date.now(),
    user:username,
    userId:userId,
    items:[...state.cart],
    subtotal:calculateSubtotal().toFixed(2),
    discount:calculateDiscount().toFixed(2),
    total:calculateTotal().toFixed(2),
    promos:state.promos.join(', ')||'Aucun',
    comment:state.comment||'Aucun',
    date:new Date().toLocaleString('fr-FR')
  };
  
  orderData.unshift(order);
  await saveOrders();
  
  const itemsText=order.items.map(i=>
    `${i.emoji} **${i.name}** x${i.quantity} - ${(i.price*i.quantity).toFixed(2)}€`
  ).join('\n');
  
  const embed={
    embeds:[{
      title:'🍺 Nouvelle Commande',
      color:0xEA580C,
      fields:[
        {name:'👤 Client',value:order.user,inline:true},
        {name:'📅 Date',value:order.date,inline:true},
        {name:'🍻 Articles',value:itemsText},
        {name:'💰 Total',value:`**${order.total}€**`},
        {name:'🎟️ Promos',value:order.promos}
      ],
      timestamp:new Date().toISOString()
    }]
  };
  
  if(state.comment)embed.embeds[0].fields.push({name:'💬 Commentaire',value:state.comment});
  
  fetch(WEBHOOK_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(embed)
  })
  .then(r=>{
    if(r.ok){
      alert('✅ Commande envoyée avec succès!');
      state.cart=[];
      state.promos=[];
      state.comment='';
      render();
    }else{
      alert('❌ Erreur lors de l\'envoi');
    }
  })
  .catch(()=>alert('❌ Erreur réseau'));
}

<script>
// Suite du code JavaScript

function generateNumbers(){
  const nums=[];
  for(let i=0;i<20;i++){
    nums.push(Math.floor(Math.random()*90)+10);
  }
  return nums;
}

async function startScratch(){
  const code=state.code.toUpperCase().trim();
  if(!code){
    alert('Veuillez entrer un code ticket!');
    return;
  }
  if(!tickets[code]){
    alert('❌ Code invalide!');
    return;
  }
  
  const used=scratchData.some(s=>s.code===code&&s.userId===(state.user?state.user.id:'guest'));
  if(used){
    alert('❌ Ce code a déjà été utilisé!');
    return;
  }
  
  const ticket=tickets[code];
  const winningNums=[];
  const yourNums=generateNumbers();
  
  for(let i=0;i<6;i++){
    winningNums.push(yourNums[Math.floor(Math.random()*20)]);
  }
  
  if(ticket.w>0){
    let idx=Math.floor(Math.random()*20);
    for(let j=0;j<3;j++){
      yourNums[idx]=winningNums[j];
      idx=(idx+4)%20;
    }
  }
  
  state.winNums=winningNums;
  state.yourNums=yourNums;
  state.win=ticket.w;
  state.scratching=true;
  
  render();
  setTimeout(()=>initCanvas(),100);
}

function initCanvas(){
  canvas=document.getElementById('scratchCanvas');
  if(!canvas)return;
  
  ctx=canvas.getContext('2d');
  canvas.width=canvas.parentElement.offsetWidth;
  canvas.height=canvas.parentElement.offsetHeight;
  
  const gradient=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  gradient.addColorStop(0,'#cbd5e1');
  gradient.addColorStop(1,'#94a3b8');
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  ctx.font='bold 20px Inter';
  ctx.fillStyle='#475569';
  ctx.textAlign='center';
  ctx.fillText('GRATTEZ POUR RÉVÉLER',canvas.width/2,canvas.height/2-10);
  ctx.font='32px Arial';
  ctx.fillText('🎫',canvas.width/2,canvas.height/2+25);
  
  canvas.addEventListener('mousedown',()=>isDrawing=true);
  canvas.addEventListener('mouseup',()=>isDrawing=false);
  canvas.addEventListener('mousemove',scratch);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();isDrawing=true});
  canvas.addEventListener('touchend',()=>isDrawing=false);
  canvas.addEventListener('touchmove',e=>{e.preventDefault();scratch(e.touches[0])});
}

function scratch(e){
  if(!isDrawing)return;
  
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX||e.pageX)-rect.left;
  const y=(e.clientY||e.pageY)-rect.top;
  
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath();
  ctx.arc(x,y,30,0,Math.PI*2);
  ctx.fill();
  
  checkScratchProgress();
}

function checkScratchProgress(){
  const imgData=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let transparent=0;
  for(let i=3;i<imgData.length;i+=4){
    if(imgData[i]===0)transparent++;
  }
  scratchPct=(transparent/(imgData.length/4))*100;
  
  if(scratchPct>60){
    revealResult();
  }
}

async function revealResult(){
  isDrawing=false;
  
  const scratchEntry={
    id:Date.now(),
    code:state.code,
    user:state.user?state.user.username:'Invité',
    userId:state.user?state.user.id:'guest',
    win:state.win,
    date:new Date().toLocaleString('fr-FR')
  };
  
  scratchData.unshift(scratchEntry);
  await saveScratch();
  
  const embed={
    embeds:[{
      title:'🎰 Ticket à Gratter',
      color:state.win>0?0x10B981:0xEF4444,
      fields:[
        {name:'👤 Joueur',value:scratchEntry.user,inline:true},
        {name:'🎟️ Code',value:scratchEntry.code,inline:true},
        {name:state.win>0?'🎉 GAGNÉ!':'😢 Perdu',value:state.win>0?`**${state.win}€**`:'Pas de gain cette fois'},
        {name:'📅 Date',value:scratchEntry.date}
      ],
      timestamp:new Date().toISOString()
    }]
  };
  
  fetch(WEBHOOK_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(embed)
  });
  
  setTimeout(()=>{
    if(state.win>0){
      alert(`🎉 Félicitations! Vous avez gagné ${state.win}€!`);
    }else{
      alert('😢 Dommage, pas de gain cette fois...');
    }
    state.scratching=false;
    state.code='';
    scratchPct=0;
    state.page='scratch';
    render();
  },500);
}

          <div class="card p-8 mb-6">
            <h2 class="text-3xl font-bold text-gray-900 mb-6 text-center">🎰 Ticket à Gratter</h2>
            <div class="bg-gradient-to-r from-orange-50 to-orange-100 p-6 rounded-lg mb-6">
              <p class="text-center text-lg mb-4 font-semibold text-gray-800">Entrez votre code ticket</p>
              <input type="text" value="${state.code}" oninput="state.code=this.value.toUpperCase()" placeholder="MC7X9K2P" class="w-full px-4 py-3 border-2 border-orange-300 rounded-lg mb-4 text-center text-lg font-bold uppercase" maxlength="8">
              <button onclick="startScratch()" class="btn-primary w-full text-lg">🎫 Gratter le Ticket</button>
            </div>
            <div class="text-center text-sm text-gray-500">
              <p>Gains possibles: 10€, 50€, 100€, 500€</p>
            </div>
          </div>
          
          <div class="card p-6">
            <h3 class="text-xl font-bold text-gray-900 mb-4">📊 Historique des Gains</h3>
            ${scratchData.length===0?'<p class="text-gray-500 text-center py-4">Aucun ticket gratté</p>':
              scratchData.slice(0,10).map((s,i)=>`
                <div class="flex items-center justify-between p-3 ${s.win>0?'bg-green-50 border-l-4 border-green-500':'bg-gray-50'} rounded-lg mb-2">
                  <div>
                    <p class="font-semibold text-gray-900">${s.user}</p>
                    <p class="text-xs text-gray-600">${s.code} - ${s.date}</p>
                  </div>
                  <p class="text-xl font-bold ${s.win>0?'text-green-600':'text-gray-400'}">${s.win>0?'+'+s.win+'€':'0€'}</p>
                </div>
              `).join('')
            }
          </div>
        </div>
      </div>
    `;
  }else{
    app.innerHTML=nav+`
      <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
          <div class="scratch-ticket">
            <div class="bg-gradient-to-r from-orange-500 to-orange-600 p-6 text-center text-white">
              <h2 class="text-3xl font-bold mb-2">🎰 TAVERNE MCCAIN</h2>
              <p class="text-lg">Ticket à Gratter</p>
            </div>
            
            <div class="p-6 bg-purple-50">
              <p class="text-center font-bold text-gray-700 mb-4">NUMÉROS GAGNANTS</p>
              <div class="grid grid-cols-6 gap-2">
                ${state.winNums.map(n=>`
                  <div class="bg-gradient-to-br from-yellow-400 to-yellow-500 text-center py-3 rounded-lg font-bold text-xl text-yellow-900 shadow-md">${n}</div>
                `).join('')}
              </div>
            </div>
            
            <div class="p-6 relative" style="min-height:300px">
              <p class="text-center font-bold text-gray-700 mb-4">VOS NUMÉROS</p>
              <div class="grid grid-cols-5 gap-2 relative z-0">
                ${state.yourNums.map(n=>{
                  const isWinner=state.winNums.includes(n);
                  return`<div class="bg-gradient-to-br ${isWinner?'from-green-400 to-green-500':'from-gray-200 to-gray-300'} text-center py-4 rounded-lg font-bold text-lg ${isWinner?'text-green-900':'text-gray-700'} shadow">${n}</div>`;
                }).join('')}
              </div>
              <canvas id="scratchCanvas" class="scratch-canvas"></canvas>
            </div>
            
            <div class="bg-gray-800 text-white text-center p-4 text-sm">
              <p>Grattez pour découvrir si vous avez gagné!</p>
            </div>
          </div>
        </div>
      </div>
    `;
  }
}

function renderProfile(app,nav){
  if(!state.user){
    state.page='home';
    render();
    return;
  }
  
  const userOrders=orderData.filter(o=>o.userId===state.user.id);
  
  app.innerHTML=nav+`
    <div class="container mx-auto px-4 py-8">
      <div class="max-w-4xl mx-auto">
        <div class="card p-8 mb-6">
          <h2 class="text-3xl font-bold text-gray-900 mb-6">👤 Mon Profil</h2>
          <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-lg mb-4">
            <img src="https://cdn.discordapp.com/avatars/${state.user.id}/${state.user.avatar}.png" class="w-20 h-20 rounded-full shadow-lg"/>
            <div>
              <p class="font-bold text-2xl text-gray-900">${state.user.username}</p>
              <p class="text-gray-600">ID: ${state.user.id}</p>
            </div>
          </div>
          <div class="grid md:grid-cols-2 gap-4">
            <div class="p-4 bg-orange-50 rounded-lg">
              <p class="text-sm text-gray-600">Total Commandes</p>
              <p class="font-bold text-2xl text-orange-600">${userOrders.length}</p>
            </div>
            <div class="p-4 bg-purple-50 rounded-lg">
              <p class="text-sm text-gray-600">Tickets Grattés</p>
              <p class="font-bold text-2xl text-purple-600">${scratchData.filter(s=>s.userId===state.user.id).length}</p>
            </div>
          </div>
        </div>
        
        <div class="card p-8">
          <h3 class="text-2xl font-bold text-gray-900 mb-4">📦 Mes Commandes</h3>
          ${userOrders.length===0?'<p class="text-gray-500 text-center py-8">Aucune commande</p>':
            userOrders.map((o,i)=>`
              <div class="card p-6 mb-4">
                <div class="flex justify-between items-center mb-4">
                  <div>
                    <p class="text-lg font-bold text-gray-900">Commande #${userOrders.length-i}</p>
                    <p class="text-sm text-gray-600">${o.date}</p>
                  </div>
                  <p class="text-2xl font-bold text-orange-600">${o.total}€</p>
                </div>
                <div class="border-t pt-4">
                  <p class="font-semibold text-gray-700 mb-2">Articles:</p>
                  ${o.items.map(it=>`
                    <p class="text-sm text-gray-600">${it.emoji} ${it.name} x${it.quantity} - ${(it.price*it.quantity).toFixed(2)}€</p>
                  `).join('')}
                  ${o.comment!=='Aucun'?`<div class="mt-3 p-3 bg-gray-50 rounded-lg"><p class="text-xs text-gray-600">Commentaire:</p><p class="text-sm text-gray-700">${o.comment}</p></div>`:''}
                </div>
              </div>
            `).join('')
          }
        </div>
      </div>
    </div>
  `;
}

window.addEventListener('load',async()=>{
  await loadOrders();
  await loadScratch();
  getUser();
  render();
});
</script>
</body>
</html>
